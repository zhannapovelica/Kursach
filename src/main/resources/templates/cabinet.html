<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" th:href="@{main.css}"/>
<link rel="stylesheet" th:href="@{doctor.css}"/>
<link rel="stylesheet" th:href="@{cabinet.css}"/>
<link rel="stylesheet" th:href="@{css/example-bot-media-query.css}"/>
<link rel="stylesheet" th:href="@{css/cabinet-media-query.css}"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Інформаційна система психологічної допомоги</title>
</head>

<body>
<div th:replace="header :: header"></div>
<main>
    <div id="user-block" class="user">
        <div class="user-photo"></div>
        <div class="users-info">
            <div class="user-name">
                <h>Name:</h>
                <a id="user-name" class="name-user"></a>
            </div>
            <div class="user-surname">
                <h>Surname:</h>
                <a id="user-surname" class="surname-user"></a>
            </div>
            <div class="user-fathers-name">
                <h>Fathers name:</h>
                <a id="user-last-name" class="fathers-name-user"></a>
            </div>
            <div class="age-user">
                <h>Age:</h>
                <a id="user-age" class="user-age"></a>
            </div>
            <div class="email-user">
                <h>Email:</h>
                <a id="user-email" class="user-email"></a>
            </div>
            <div><a>Статус користувача: у мережі</a></div>
        </div>
    </div>
    <div class="course-block"><a>Курси, які проходить:</a>
        <div th:each="reception :${receptions}">
            <a th:text="${reception.getCourse().getName()}"></a>
            <div class="acception1"> <a th:if="${reception.isAccept()}">Підтверджено</a></div>
            <div class="acception2"> <a th:if="${!reception.isAccept()}">Не підтверджено</a></div>
        </div>
    </div>

</main>

</body>
<div th:replace="footer :: footer"></div>
<div class="section14-block-footer">
    <div class="footer-under1">© Створено під керівництвом xie</div>
    <div class="footer-under2">
        2024 © Платформа "Requiem". Всі права захищено.
    </div>
</div>
<div id="bo">
    <iframe id="fr" th:src="@{/chatbot}"></iframe>
</div>
<script th:src="@{bot-size-script.js}"></script>
<script th:src="@{cabi.js}"></script>
</html>
