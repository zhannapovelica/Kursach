<script>
    let page = 1;
    const excludeIds = [
        ...document.querySelectorAll('#recentFeedbacks .feedback, .feedback').map(el => parseInt(el.getAttribute('data-id')))
    ];

    document.getElementById('loadMore').addEventListener('click', () => {
        fetch(`/feedback/more?page=${page}&excludeIds=${excludeIds.join(',')}`)
            .then(response => response.json())
            .then(data => {
                if (data.length === 0) {
                    document.getElementById('loadMore').style.display = 'none';
                    return;
                }
                const container = document.getElementById('recentFeedbacks');
                data.forEach(feedback => {
                    const div = document.createElement('div');
                    div.className = 'feedback';
                    div.setAttribute('data-id', feedback.id);
                    div.innerHTML = `
                            <p>${feedback.fidBack}</p>
                            <p>Лайки: ${feedback.likes} | Дизлайки: ${feedback.dislikes}</p>
                        `;
                    container.appendChild(div);
                    excludeIds.push(feedback.id);
                });
                page++;
            });
    });
</script>
<script th:src="@{bot-size-script.js}"></script>
<script th:src="@{bot-chat-size.js}"></script>
<script th:src="@{adminM.js}"></script>
</body>
