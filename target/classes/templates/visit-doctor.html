<style>
    body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        color: #333;
        margin: 0;
        padding: 40px;
    }

    .admin-title {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 700;
        color: #ff6600;
        margin-bottom: 30px;
        position: relative;
        text-align: center;
    }

    .admin-title::before,
    .admin-title::after {
        content: "";
        flex: 1;
        height: 2px;
        background: #ff6600;
        margin: 0 15px;
        opacity: 0.6;
    }

    .program-list {
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 25px;
    }

    .program-card {
        display: flex;
        gap: 20px;
        background-color: #fff1e6;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .program-card img {
        width: 180px;
        height: 120px;
        object-fit: cover;
        border-radius: 8px;
    }

    .program-info {
        flex: 1;
    }

    .program-info h3 {
        color: #ff6600;
        margin-top: 0;
        margin-bottom: 10px;
    }

    .program-info p {
        margin: 4px 0;
    }
</style>
