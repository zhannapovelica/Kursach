<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
        rel="stylesheet"
/>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Інформаційна система психологічної допомоги</title>
</head>
<body>


<div class="create">
    <form th:action="@{/doctor-create}" method="post">
        <button type="submit">
            <a>Додати нового лікаря</a>
        </button>
    </form>
</div>

<div class="block" th:each="doctor :${doctors}">
    <form th:action="@{/doctor-menu-{id}(id=${doctor.getId()})}" method="get">
        <button type="submit">
            <a th:text="${doctor.getFullName()}"></a>
            <p></p>
            <a th:text="${doctor.getPosition()}"></a>
        </button>
    </form>
</div>
</body>
</html>>
<style>
    .block{
        border: 3px solid orange;
    }
</style>
