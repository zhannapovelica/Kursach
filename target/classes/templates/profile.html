<body>
<div th:replace="header :: header"></div>
<main>
    <div>
        <div id="login-block" class="login-block">
            <form action="/login" method="post">
                <div class="login-input-block">
                    <a>Ваш email:</a>
                    <input class="login-input" id="email" type="email" name="email">
                </div>
                <div class="login-input-block">
                    <a>Ваш пароль:</a>
                    <input class="login-input" id="password" type="text" name="password">
                </div>
                <button id="login-confirm" type="submit"><a>Увійти</a></button>
            </form>
        </div>
    </div>
</main>

</body>
